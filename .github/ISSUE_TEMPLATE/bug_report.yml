name: Bug report
description: Report a reproducible problem in Nexconn ChatUI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private user data, or unpatched security vulnerabilities. Report security issues to support@nexconn.ai.
  - type: input
    id: version
    attributes:
      label: ChatUI version
      placeholder: 26.3.0
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Platform and environment
      description: Include browser, operating system, framework, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant logs, stack traces, or write "None" if no logs are available.
      render: text
    validations:
      required: true
  - type: textarea
    id: minimal_reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a minimal code sample or a link to a small reproducible project. Remove credentials and private data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
